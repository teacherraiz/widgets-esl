<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo 5: Evaluate - Teacher dos Famosos</title>
  <style>
    :root {
      --primary-orange: #FF7A00;
      --secondary-blue: #1E5AA8;
      --bg-color: #FFF8F0;
      --card-bg: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #6C757D;
      --correct-blue: #1E5AA8;
      --correct-bg: #E8F1FC;
      --incorrect-orange: #C75000;
      --incorrect-bg: #FDF0ED;
      --border-color: #E2E8F0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .widget-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border: 1px solid rgba(30, 90, 168, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 20px 24px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .module-badge {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--primary-orange);
      background: rgba(255, 122, 0, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .score-counter {
      font-size: 14px;
      font-weight: 700;
      color: var(--secondary-blue);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #E2E8F0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary-orange);
      width: 0%;
      transition: width 0.3s ease;
    }

    .item-tracker {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 600;
    }

    /* Content Area */
    .content-area {
      padding: 24px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-card {
      width: 100%;
    }

    .type-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--secondary-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Audio Button */
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--secondary-blue);
      color: #FFFFFF;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: opacity 0.2s;
    }

    .audio-btn:hover {
      opacity: 0.9;
    }

    .audio-btn svg {
      fill: currentColor;
      width: 18px;
      height: 18px;
    }

    /* Options / Inputs */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border: 2px solid var(--border-color);
      background: #FFFFFF;
      border-radius: 8px;
      font-size: 15px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--secondary-blue);
      background: #F8FAFC;
    }

    .option-btn.selected {
      border-color: var(--secondary-blue);
      background: var(--correct-bg);
    }

    .option-btn.correct {
      border-color: var(--correct-blue);
      background-color: var(--correct-bg);
      color: var(--correct-blue);
      font-weight: 600;
    }

    .option-btn.incorrect {
      border-color: var(--incorrect-orange);
      background-color: var(--incorrect-bg);
      color: var(--incorrect-orange);
      font-weight: 600;
    }

    .text-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .text-input {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .text-input:focus:not(:disabled) {
      border-color: var(--secondary-blue);
    }

    .submit-btn {
      align-self: flex-start;
      background-color: var(--primary-orange);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .submit-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      background-color: #CBD5E1;
      cursor: not-allowed;
    }

    /* Ranking List */
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      background: #FFFFFF;
      border-radius: 8px;
      font-size: 14px;
    }

    .ranking-item-controls {
      display: flex;
      gap: 6px;
    }

    .rank-nav-btn {
      background: #F1F5F9;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      color: var(--text-main);
    }

    .rank-nav-btn:hover:not(:disabled) {
      background: var(--secondary-blue);
      color: white;
    }

    .rank-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Justification Textarea */
    .justification-box {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .justification-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary-blue);
    }

    .justification-textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct {
      background-color: var(--correct-bg);
      border: 1px solid var(--correct-blue);
      color: var(--correct-blue);
    }

    .feedback-box.incorrect {
      background-color: var(--incorrect-bg);
      border: 1px solid var(--incorrect-orange);
      color: var(--incorrect-orange);
    }

    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Footer Navigation */
    .footer {
      padding: 16px 24px;
      background: #FAFAFA;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .prev-btn {
      background-color: #E2E8F0;
      color: var(--text-main);
    }

    .prev-btn:hover:not(:disabled) {
      background-color: #CBD5E1;
    }

    .next-btn {
      background-color: var(--primary-orange);
      color: #FFFFFF;
    }

    .next-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Final Summary Screen */
    .summary-card {
      text-align: center;
      padding: 20px 0;
    }

    .summary-title {
      font-size: 24px;
      color: var(--secondary-blue);
      margin-bottom: 8px;
    }

    .summary-score {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary-orange);
      margin-bottom: 16px;
    }

    .summary-list {
      text-align: left;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .summary-item {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 13px;
    }

    .summary-item.is-correct {
      border-left: 4px solid var(--correct-blue);
      background: var(--correct-bg);
    }

    .summary-item.is-incorrect {
      border-left: 4px solid var(--incorrect-orange);
      background: var(--incorrect-bg);
    }

    .restart-btn {
      margin-top: 20px;
      background: var(--secondary-blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

  </style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <div class="header-top">
      <span class="module-badge">5. EVALUATE</span>
      <span class="score-counter" id="scoreCounter">0 de 10 corretas</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="item-tracker" id="itemTracker">Item 1 de 10</div>
  </div>

  <div class="content-area" id="contentArea">
    <!-- Dynamic item rendered here -->
  </div>

  <div class="footer" id="footerNav">
    <button class="nav-btn prev-btn" id="prevBtn" onclick="handlePrev()">Anterior</button>
    <button class="nav-btn next-btn" id="nextBtn" onclick="handleNext()" disabled>Próximo</button>
  </div>
</div>

<script>
  const payload = {"prompt_source": "C", "topic": "Questions and Answers (do - did - will - would)", "theme": "Daily Practical Errands - Supermarket", "cefr_level": "A2", "accent": "en-GB", "brand": "Teacher dos Famosos", "module_id": "5_evaluate", "audio_ratio_target": 0.2, "items": [{"type": "audio_paraphrase", "audio_text": "Is it possible for you to check if there is more olive oil in the back room?", "sentence_options": ["Did you check the olive oil in the back room?", "Would you mind checking if there is more olive oil in the stockroom?", "Will you buy olive oil in the back room?"], "correct_index": 1, "explanation": "'Would you mind checking...?' parafraseia com exatidão e máxima cortesia o pedido diplomático de verificar o estoque."}, {"type": "audio_paraphrase", "audio_text": "Are you in the habit of shopping at Sainsbury's every afternoon?", "sentence_options": ["Do you usually shop at Sainsbury's in the afternoon?", "Did you shop at Sainsbury's yesterday afternoon?", "Would you like to shop at Sainsbury's this afternoon?"], "correct_index": 0, "explanation": "'Do you usually shop...?' expressa com perfeição a ideia de ter o hábito no presente."}, {"type": "paraphrase_quiz", "cloze_text": "Frase original: 'Are you going to pay by card in a moment?'\nParafraseando com o auxiliar adequado: '___ you pay by card?'", "correct_answer": "Will", "feedback_correct": "Excelente avaliação! 'Will you pay by card?' reescreve a pergunta sobre o futuro imediato. 💳", "feedback_incorrect": "Para reformular uma pergunta sobre uma ação futura imediata de forma simples, use 'Will'."}, {"type": "rank_best_answer", "question": "Um atendente britânico no Sainsbury's pergunta: 'Would you like a bag for your items?' Qual é a ordem das respostas da MAIS adequada e polida para a MENOS adequada?", "answer_options": ["1. Yes, please, that would be great. / 2. Yes, I would. / 3. Give me one bag.", "1. Give me one bag. / 2. Yes, I would. / 3. Yes, please, that would be great.", "1. Yes, I would. / 2. Give me one bag. / 3. Yes, please, that would be great."], "correct_ranking": [0, 1, 2], "explanation": "A resposta 1 é extremamente cortês e natural. A resposta 2 é gramaticalmente correta mas um pouco seca. A resposta 3 é um imperativo direto que soa maleducado no Reino Unido."}, {"type": "justify_choice", "question": "Lorraine precisa perguntar ao funcionário se haverá reposição de pão integral amanhã. Qual frase ela deve escolher?", "options": ["Do you restock wholemeal bread tomorrow?", "Will you restock wholemeal bread tomorrow?", "Did you restock wholemeal bread tomorrow?"], "correct_index": 1, "justification_prompt": "Explique por que a opção escolhida é a correta considerando o tempo verbal da palavra 'tomorrow'."}, {"type": "peer_correction", "incorrect_sentence": "Lorraine asked the assistant: 'Did you will open another checkout lane soon?'", "correct_answer": "Will you open another checkout lane soon?", "explanation": "Não se pode misturar dois auxiliares ('Did' e 'will') na mesma pergunta. Para perguntar sobre um fato futuro, use apenas 'Will'."}, {"type": "peer_correction", "incorrect_sentence": "Checkout clerk: 'Do you pay with cash?' Lorraine: 'No, I didn't.'", "correct_answer": "No, I don't.", "explanation": "Houve desalinhamento de tempo verbal. Se a pergunta usa o auxiliar no presente 'Do', a resposta curta deve corresponder no presente ('No, I don't')."}, {"type": "rank_best_answer", "question": "Lorraine quer pedir educadamente para o funcionário alcançar uma caixa no alto. Qual é a ordem das opções da MAIS natural/educada para a MENOS educada?", "answer_options": ["1. Would you mind reaching that box for me, please? / 2. Could you help me with that box? / 3. Did you grab that box for me?", "1. Did you grab that box for me? / 2. Could you help me? / 3. Would you mind reaching that box?", "1. Could you help me? / 2. Did you grab that box? / 3. Would you mind reaching that box?"], "correct_ranking": [0, 1, 2], "explanation": "'Would you mind + verb-ing...?' é a forma ideal e mais polida. 'Could you...?' também é muito boa. 'Did you grab...?' refere-se ao passado e não faz sentido como pedido."}, {"type": "justify_choice", "question": "Por que 'Would you like some tea?' é mais apropriado no atendimento do que 'Do you want some tea?'", "options": ["Porque 'Would you like' expressa oferta cortês, enquanto 'Do you want' pode soar muito direto ou brusco.", "Porque 'Do you want' é gramaticalmente errado em qualquer situação.", "Porque 'Would' é o passado do verbo querer."], "correct_index": 0, "justification_prompt": "Explique brevemente a diferença entre ser direto e ser polido ao fazer ofertas em inglês."}, {"type": "peer_correction", "incorrect_sentence": "Assistant: 'Would you like your receipt in the bag?' Customer: 'Yes, I do like.'", "correct_answer": "Yes, please.", "explanation": "A resposta natural para ofertas com 'Would you like...?' no comércio é 'Yes, please' ou 'Yes, I would', e nunca 'Yes, I do like'."}]};

  let currentIndex = 0;
  let userAnswers = new Array(payload.items.length).fill(null);
  let rankingState = [];

  // Speech Synthesis Helper
  function playAudio(text) {
    if (!('speechSynthesis' in window)) {
      alert("A reprodução de áudio não é suportada neste navegador.");
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const accent = payload.accent || "en-GB";

    function setVoiceAndSpeak() {
      const voices = window.speechSynthesis.getVoices();
      let selectedVoice = voices.find(v => v.lang.replace('_', '-').toLowerCase().startsWith(accent.toLowerCase()));
      if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.toLowerCase().startsWith('en'));
      }
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      utterance.lang = accent;
      window.speechSynthesis.speak(utterance);
    }

    if (window.speechSynthesis.getVoices().length === 0) {
      window.speechSynthesis.onvoiceschanged = setVoiceAndSpeak;
    } else {
      setVoiceAndSpeak();
    }
  }

  // Exact Match Normalization
  function normalizeText(text) {
    if (!text) return '';
    let str = text.trim();
    str = str.replace(/\s+/g, ' ');
    str = str.toLowerCase();
    if ((str.startsWith('"') && str.endsWith('"')) || (str.startsWith("'") && str.endsWith("'"))) {
      str = str.substring(1, str.length - 1).trim();
    }
    str = str.replace(/[.,!?;:]+$/, '');
    return str.trim();
  }

  function isExactMatch(input, target) {
    const normInput = normalizeText(input);
    if (Array.isArray(target)) {
      return target.some(t => normalizeText(t) === normInput);
    }
    return normInput === normalizeText(target);
  }

  function updateScoreAndProgress() {
    const total = payload.items.length;
    let correctCount = 0;

    userAnswers.forEach(ans => {
      if (ans && ans.isCorrect) correctCount++;
    });

    document.getElementById('scoreCounter').innerText = `${correctCount} de ${total} corretas`;
    document.getElementById('itemTracker').innerText = `Item ${currentIndex + 1} de ${total}`;
    const progressPercent = ((currentIndex + 1) / total) * 100;
    document.getElementById('progressBar').style.width = `${progressPercent}%`;

    // Navigation buttons state
    document.getElementById('prevBtn').disabled = currentIndex === 0;

    const currentAnswerObj = userAnswers[currentIndex];
    const nextBtn = document.getElementById('nextBtn');

    if (currentIndex === total - 1) {
      nextBtn.innerText = "Finalizar";
    } else {
      nextBtn.innerText = "Próximo";
    }

    nextBtn.disabled = !currentAnswerObj || !currentAnswerObj.answered;
  }

  function renderCurrentItem() {
    const item = payload.items[currentIndex];
    const container = document.getElementById('contentArea');
    const savedAnswer = userAnswers[currentIndex];

    let html = `<div class="item-card">`;

    if (item.type === 'audio_paraphrase') {
      html += `
        <div class="type-title">Audio & Paráfrase</div>
        <button class="audio-btn" onclick="playAudio('${escapeQuotes(item.audio_text)}')">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          Ouvir Frase Original
        </button>
        <div class="question-text">Qual das opções parafraseia melhor o áudio?</div>
        <div class="options-list">
      `;
      item.sentence_options.forEach((opt, idx) => {
        let stateClass = '';
        if (savedAnswer && savedAnswer.answered) {
          if (idx === item.correct_index) stateClass = 'correct';
          else if (savedAnswer.selectedIndex === idx) stateClass = 'incorrect';
        }
        html += `
          <button class="option-btn ${stateClass}" 
            ${savedAnswer && savedAnswer.answered ? 'disabled' : ''} 
            onclick="handleMultipleChoice(${idx}, ${item.correct_index})">
            ${opt}
          </button>
        `;
      });
      html += `</div>`;

    } else if (item.type === 'paraphrase_quiz') {
      html += `
        <div class="type-title">Paráfrase Completa</div>
        <div class="question-text" style="white-space: pre-line;">${item.cloze_text}</div>
        <div class="text-input-group">
          <input type="text" id="clozeInput" class="text-input" placeholder="Digite a palavra que falta..." 
            value="${savedAnswer ? savedAnswer.userInput : ''}" 
            ${savedAnswer && savedAnswer.answered ? 'disabled' : ''} />
          ${!savedAnswer || !savedAnswer.answered ? `<button class="submit-btn" onclick="handleClozeSubmit('${escapeQuotes(item.correct_answer)}')">Verificar</button>` : ''}
        </div>
      `;

    } else if (item.type === 'rank_best_answer') {
      html += `
        <div class="type-title">Ranqueamento de Respostas</div>
        <div class="question-text">${item.question}</div>
        <div class="ranking-list" id="rankingList">
      `;
      
      const currentOrder = (savedAnswer && savedAnswer.rankingOrder) ? savedAnswer.rankingOrder : (rankingState.length === item.answer_options.length ? rankingState : item.answer_options.map((_, i) => i));
      rankingState = currentOrder;

      currentOrder.forEach((optIdx, displayIdx) => {
        html += `
          <div class="ranking-item">
            <span>${item.answer_options[optIdx]}</span>
            ${!savedAnswer || !savedAnswer.answered ? `
              <div class="ranking-item-controls">
                <button class="rank-nav-btn" ${displayIdx === 0 ? 'disabled' : ''} onclick="moveRanking(${displayIdx}, -1)">▲</button>
                <button class="rank-nav-btn" ${displayIdx === currentOrder.length - 1 ? 'disabled' : ''} onclick="moveRanking(${displayIdx}, 1)">▼</button>
              </div>
            ` : ''}
          </div>
        `;
      });
      html += `</div>`;

      if (!savedAnswer || !savedAnswer.answered) {
        html += `<button class="submit-btn" onclick="handleRankingSubmit()">Confirmar Ordem</button>`;
      }

    } else if (item.type === 'justify_choice') {
      html += `
        <div class="type-title">Escolha & Justificativa</div>
        <div class="question-text">${item.question}</div>
        <div class="options-list">
      `;
      item.options.forEach((opt, idx) => {
        let stateClass = '';
        if (savedAnswer && savedAnswer.answered) {
          if (idx === item.correct_index) stateClass = 'correct';
          else if (savedAnswer.selectedIndex === idx) stateClass = 'incorrect';
        }
        html += `
          <button class="option-btn ${stateClass}" 
            ${savedAnswer && savedAnswer.answered ? 'disabled' : ''} 
            onclick="handleJustifyChoiceSelect(${idx}, ${item.correct_index})">
            ${opt}
          </button>
        `;
      });
      html += `</div>`;

      if (savedAnswer && savedAnswer.answered) {
        html += `
          <div class="justification-box">
            <span class="justification-label">${item.justification_prompt}</span>
            <textarea class="justification-textarea" placeholder="Escreva sua justificativa aqui (opcional)..." 
              oninput="saveJustification(this.value)">${savedAnswer.justification || ''}</textarea>
          </div>
        `;
      }

    } else if (item.type === 'peer_correction') {
      html += `
        <div class="type-title">Peer Correction (Correção de Erros)</div>
        <div class="question-text">Identifique o erro e reescreva a frase corretamente:</div>
        <div style="font-weight: 600; color: var(--incorrect-orange); margin-bottom: 12px; padding: 10px; background: var(--incorrect-bg); border-radius: 6px;">
          "${item.incorrect_sentence}"
        </div>
        <div class="text-input-group">
          <input type="text" id="peerInput" class="text-input" placeholder="Digite a frase corrigida..." 
            value="${savedAnswer ? savedAnswer.userInput : ''}" 
            ${savedAnswer && savedAnswer.answered ? 'disabled' : ''} />
          ${!savedAnswer || !savedAnswer.answered ? `<button class="submit-btn" onclick="handlePeerSubmit('${escapeQuotes(item.correct_answer)}')">Verificar</button>` : ''}
        </div>
      `;
    }

    // Feedback container
    let feedbackClass = '';
    let feedbackText = '';

    if (savedAnswer && savedAnswer.answered) {
      feedbackClass = savedAnswer.isCorrect ? 'correct' : 'incorrect';
      const title = savedAnswer.isCorrect ? '✅ Resposta Correta!' : '❌ Resposta Incorreta';
      const exp = item.explanation || item.feedback_correct || item.feedback_incorrect || '';
      const correctAnsDisplay = (!savedAnswer.isCorrect && item.correct_answer) ? `<br><strong>Gabarito:</strong> ${item.correct_answer}` : '';
      
      feedbackText = `<div class="feedback-title">${title}</div>${exp}${correctAnsDisplay}`;
    }

    html += `
      <div id="feedbackBox" class="feedback-box ${feedbackClass} ${savedAnswer && savedAnswer.answered ? 'show' : ''}">
        ${feedbackText}
      </div>
    `;

    html += `</div>`;
    container.innerHTML = html;
    updateScoreAndProgress();
  }

  // Handlers for interaction
  function handleMultipleChoice(selectedIndex, correctIndex) {
    const isCorrect = selectedIndex === correctIndex;
    userAnswers[currentIndex] = {
      answered: true,
      selectedIndex: selectedIndex,
      isCorrect: isCorrect
    };
    renderCurrentItem();
  }

  function handleClozeSubmit(correctAnswer) {
    const inputEl = document.getElementById('clozeInput');
    const val = inputEl ? inputEl.value : '';
    const isCorrect = isExactMatch(val, correctAnswer);

    userAnswers[currentIndex] = {
      answered: true,
      userInput: val,
      isCorrect: isCorrect
    };
    renderCurrentItem();
  }

  function moveRanking(fromIndex, direction) {
    const toIndex = fromIndex + direction;
    if (toIndex < 0 || toIndex >= rankingState.length) return;
    const temp = rankingState[fromIndex];
    rankingState[fromIndex] = rankingState[toIndex];
    rankingState[toIndex] = temp;
    renderCurrentItem();
  }

  function handleRankingSubmit() {
    const item = payload.items[currentIndex];
    const isCorrect = JSON.stringify(rankingState) === JSON.stringify(item.correct_ranking);

    userAnswers[currentIndex] = {
      answered: true,
      rankingOrder: [...rankingState],
      isCorrect: isCorrect
    };
    renderCurrentItem();
  }

  function handleJustifyChoiceSelect(selectedIndex, correctIndex) {
    const isCorrect = selectedIndex === correctIndex;
    userAnswers[currentIndex] = {
      answered: true,
      selectedIndex: selectedIndex,
      isCorrect: isCorrect,
      justification: ''
    };
    renderCurrentItem();
  }

  function saveJustification(val) {
    if (userAnswers[currentIndex]) {
      userAnswers[currentIndex].justification = val;
    }
  }

  function handlePeerSubmit(correctAnswer) {
    const inputEl = document.getElementById('peerInput');
    const val = inputEl ? inputEl.value : '';
    const isCorrect = isExactMatch(val, correctAnswer);

    userAnswers[currentIndex] = {
      answered: true,
      userInput: val,
      isCorrect: isCorrect
    };
    renderCurrentItem();
  }

  function handleNext() {
    if (currentIndex < payload.items.length - 1) {
      currentIndex++;
      rankingState = [];
      renderCurrentItem();
    } else {
      renderFinalSummary();
    }
  }

  function handlePrev() {
    if (currentIndex > 0) {
      currentIndex--;
      rankingState = [];
      renderCurrentItem();
    }
  }

  function renderFinalSummary() {
    const container = document.getElementById('contentArea');
    document.getElementById('footerNav').style.display = 'none';
    document.getElementById('itemTracker').innerText = 'Avaliação Concluída!';

    let correctCount = 0;
    userAnswers.forEach(ans => {
      if (ans && ans.isCorrect) correctCount++;
    });

    let summaryHtml = `
      <div class="summary-card">
        <div class="summary-title">Resumo do Desempenho</div>
        <div class="summary-score">${correctCount} / ${payload.items.length}</div>
        <p style="color: var(--text-muted); font-size: 14px;">Confira abaixo a revisão das suas respostas:</p>
        <div class="summary-list">
    `;

    payload.items.forEach((item, idx) => {
      const userAns = userAnswers[idx];
      const isCorrect = userAns && userAns.isCorrect;
      summaryHtml += `
        <div class="summary-item ${isCorrect ? 'is-correct' : 'is-incorrect'}">
          <strong>Item ${idx + 1}:</strong> ${getItemSummaryTitle(item)} <br>
          <span style="color: ${isCorrect ? 'var(--correct-blue)' : 'var(--incorrect-orange)'}; font-weight: 600;">
            ${isCorrect ? 'Correct' : 'Incorrect'}
          </span>
          <div><small>${item.explanation || item.feedback_correct || ''}</small></div>
        </div>
      `;
    });

    summaryHtml += `
        </div>
        <button class="restart-btn" onclick="restartQuiz()">Revisar Atividade</button>
      </div>
    `;

    container.innerHTML = summaryHtml;
  }

  function getItemSummaryTitle(item) {
    if (item.audio_text) return item.audio_text;
    if (item.question) return item.question;
    if (item.cloze_text) return item.cloze_text.split('\n')[0];
    if (item.incorrect_sentence) return item.incorrect_sentence;
    return 'Questão de Avaliação';
  }

  function restartQuiz() {
    currentIndex = 0;
    userAnswers = new Array(payload.items.length).fill(null);
    rankingState = [];
    document.getElementById('footerNav').style.display = 'flex';
    renderCurrentItem();
  }

  function escapeQuotes(str) {
    if (!str) return '';
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  // Initial setup
  renderCurrentItem();
</script>

</body>
</html>
